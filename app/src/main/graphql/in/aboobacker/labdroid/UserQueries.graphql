query ProfileQuery {
  currentUser {
    name
    username
    id
    publicEmail
    avatarUrl
    bio
    jobTitle
    location
    organization
    webUrl
    duoClassicChatAvailable
    duoChatAvailableFeatures
    status {
      emoji
      message
      availability
      clearStatusAt
    }
    userPreferences {
      duoDefaultNamespace {
        id
      }
    }
    todos(state: pending) {
      count
    }
    starredProjects(first: 5) {
      nodes {
        id
        name
        nameWithNamespace
        description
        starCount
        forksCount
        fullPath
        visibility
        avatarUrl
        lastActivityAt
        webUrl
      }
    }
  }
}

query DashboardQuery {
  currentUser {
    name
    username
    id
    avatarUrl
    duoClassicChatAvailable
    duoChatAvailableFeatures
    status {
      emoji
      message
      availability
      clearStatusAt
    }
    userPreferences {
      duoDefaultNamespace {
        id
      }
    }
    todos(state: pending) {
      count
    }
    starredProjects(first: 5) {
      nodes {
        id
        name
        nameWithNamespace
        description
        starCount
        forksCount
        fullPath
        visibility
        avatarUrl
        lastActivityAt
        webUrl
        maxAccessLevel {
          integerValue
        }
        userPermissions {
          pushCode
          downloadCode
          adminProject
          adminIssue
          createIssue
          createMergeRequestIn
        }
      }
    }
    projectMemberships(first: 5) {
      nodes {
        accessLevel {
          integerValue
        }
        project {
          id
          name
          nameWithNamespace
          description
          fullPath
          avatarUrl
          starCount
          forksCount
          visibility
          lastActivityAt
          webUrl
          maxAccessLevel {
            integerValue
          }
          userPermissions {
            pushCode
            downloadCode
            adminProject
            adminIssue
            createIssue
            createMergeRequestIn
          }
        }
      }
    }
  }
}
